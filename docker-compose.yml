services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amman
      POSTGRES_USER: amman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - amman_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amman -d amman"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://amman:${POSTGRES_PASSWORD}@db:5432/amman
      RUN_WORKER: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  amman_pg:
