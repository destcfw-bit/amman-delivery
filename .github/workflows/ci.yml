name: AMMAN DELIVERY checks
on:
  push:
    branches: [main, release/amman-production]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/accounting.js
          node --check src/worker.js
      - run: npm test
